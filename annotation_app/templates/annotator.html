<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>标注工作区</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="title-wrap">
        <h1>Annotation Workspace</h1>
        <p class="sub">高质量标注流程：样本验证 → Step/Claim/依赖标注 → 总览提交</p>
      </div>
      <div class="status-wrap">
        <span class="status-chip">Reviewer 工具已隔离</span>
        <span id="saveState" class="save-state">未保存</span>
      </div>
    </header>

    <section class="control-bar">
      <label class="field">
        <span>标注者 ID</span>
        <input id="annotator" placeholder="例如：ann-01" />
      </label>
      <label class="field grow">
        <span>JSONL 路径</span>
        <input id="jsonlPath" placeholder="/path/to/data.jsonl" />
      </label>
      <div class="control-actions">
        <button class="ghost" onclick="loadDataset()">加载数据</button>
        <button class="ghost" onclick="saveProgress()">手动保存</button>
        <button class="primary" onclick="goStep(6)">提交前总览</button>
      </div>
    </section>

    <main class="layout">
      <aside id="casePanel" class="case-panel">
        <div class="aside-head">
          <h3>任务导航</h3>
          <p>按题目切换，进度自动恢复</p>
        </div>
        <ul id="caseList"></ul>
      </aside>

      <section class="panel workspace-main">
        <nav class="step-nav" aria-label="Annotation steps">
          <button class="step-btn" data-step="1" onclick="goStep(1)">1 多采样验证</button>
          <button class="step-btn" data-step="2" onclick="goStep(2)">2 Step切分</button>
          <button class="step-btn" data-step="3" onclick="goStep(3)">3 Claim整理</button>
          <button class="step-btn" data-step="4" onclick="goStep(4)">4 Claim校验</button>
          <button class="step-btn" data-step="5" onclick="goStep(5)">5 依赖关系</button>
          <button class="step-btn" data-step="6" onclick="goStep(6)">6 结果总览</button>
        </nav>

        <article class="context-card">
          <h2 id="caseTitle">未加载</h2>
          <pre id="qAndA"></pre>
        </article>

        <article id="stepContent" class="workspace-content"></article>
      </section>
    </main>
  </div>

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
