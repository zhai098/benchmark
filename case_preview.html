<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Omni-MATH JSONL Viewer (MathJax)</title>
  <style>
    body { max-width: 920px; margin: 2rem auto; font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial; line-height: 1.6; }
    h1 { font-size: 1.6rem; margin-bottom: .5rem; }
    .meta { color: #444; margin-bottom: 1rem; }
    .bar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin:12px 0 16px; }
    .block { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px 16px; margin: 12px 0; }
    .label { font-weight: 700; color: #953b3f; }
    #question, #solution, #answer { white-space: pre-wrap; }
    .nav { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
    button { padding: 6px 12px; border: 1px solid #d1d5db; border-radius: 6px; background: #f9fafb; cursor: pointer; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    .muted { color: #6b7280; font-size: .9rem; }
    .error { color:#b91c1c; background:#fee2e2; border:1px solid #fecaca; padding:8px 10px; border-radius:6px; display:none; }
    .hint { color:#374151; background:#f3f4f6; border:1px solid #e5e7eb; padding:8px 10px; border-radius:6px; }
  </style>

  <!-- MathJax v3：支持 \( \) / \[ \] / $ $ -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(','\\)'], ['$', '$']],
        displayMath: [['\\[','\\]']],
        tags: 'ams'
      },
      chtml: { scale: 1.0 },
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
  <h1>Omni-MATH JSONL Viewer</h1>
  <div class="meta">
    从本地 <code>.jsonl</code> 文件加载数据（每行一个 JSON 对象），将题面与解答中的 LaTeX 渲染成可读公式。<br>
    提示：若你的 JSONL 是原始文本里的 <code>\\(</code>、<code>\\[</code>，本页会自动归一化为 <code>\(</code>、<code>\[</code>。
  </div>

  <div class="bar">
    <label for="file">选择 JSONL 文件：</label>
    <input id="file" type="file" accept=".jsonl,.json,.txt" />
    <span class="muted">已加载题目数：<span id="total">0</span></span>
    <span class="muted">当前：第 <span id="page">0</span> 题</span>
  </div>

  <div id="err" class="error"></div>
  <div id="hint" class="hint" style="display:none;"></div>

  <!-- 内容区 -->
  <div class="block"><span class="label">Domain：</span><span id="domain"></span></div>
  <div class="block"><span class="label">Difficulty：</span><span id="difficulty"></span></div>
  <div class="block"><span class="label">Source：</span><span id="source"></span></div>
  <div class="block"><span class="label">Question：</span><div id="question"></div></div>
  <div class="block"><span class="label">Solution：</span><div id="solution"></div></div>
  <div class="block"><span class="label">Answer：</span><div id="answer"></div></div>

  <div class="nav">
    <button id="prevBtn" disabled>« 上一题</button>
    <button id="nextBtn" disabled>下一题 »</button>
    <span class="muted">第 <span id="page2">0</span> / <span id="total2">0</span> 题</span>
  </div>

  <script>
    // ============ 小工具函数 ============
    // 把 JSONL 原始里的 \\( \\[ 归一化为 \( \[ （若你的数据是已经 JSON.parse 后的字符串，则通常不需要，但做一层保险）
    function normalizeLatex(s) {
      if (!s) return "";
      return String(s)
        .replaceAll("\\\\(", "\\(")
        .replaceAll("\\\\)", "\\)")
        .replaceAll("\\\\[", "\\[")
        .replaceAll("\\\\]", "\\]")
        .replaceAll("\\\\", "\\"); // 修复 \cdot 等命令的双反斜杠
    }

    // 兼容不同字段命名，把对象映射到 {domain, difficulty, source, problem, solution, answer}
    function normalizeItem(obj) {
      const get = (...keys) => {
        for (const k of keys) {
          if (obj[k] !== undefined && obj[k] !== null) return String(obj[k]);
        }
        return "";
      };
      return {
        domain: get('domain','Domain','category','main_category'),
        difficulty: get('difficulty','Difficulty','diff','level'),
        source: get('source','Source','problemSource','competition','Competition','source_name'),
        problem: get('problem','Problem','question','question_text','prompt','content'),
        solution: get('solution','Solution','reference_solution','reference_answer','explanation'),
        answer: get('answer','Answer','final_answer','ans')
      };
    }

    // ============ 状态与元素 ============
    const el = {
      total: document.getElementById('total'),
      total2: document.getElementById('total2'),
      page: document.getElementById('page'),
      page2: document.getElementById('page2'),
      file: document.getElementById('file'),
      err: document.getElementById('err'),
      hint: document.getElementById('hint'),

      domain: document.getElementById('domain'),
      difficulty: document.getElementById('difficulty'),
      source: document.getElementById('source'),
      question: document.getElementById('question'),
      solution: document.getElementById('solution'),
      answer: document.getElementById('answer'),

      prev: document.getElementById('prevBtn'),
      next: document.getElementById('nextBtn'),
    };

    let DATA = [];   // 解析后的数组
    let idx = 0;     // 当前索引

    // ============ 渲染 ============
    async function render(i) {
      if (!DATA.length) {
        el.domain.textContent = "";
        el.difficulty.textContent = "";
        el.source.textContent = "";
        el.question.textContent = "";
        el.solution.textContent = "";
        el.answer.textContent = "";
        el.page.textContent = "0";
        el.page2.textContent = "0";
        el.total.textContent = "0";
        el.total2.textContent = "0";
        el.prev.disabled = true;
        el.next.disabled = true;
        return;
      }

      const item = DATA[i];
      el.page.textContent = String(i + 1);
      el.page2.textContent = String(i + 1);
      el.total.textContent = String(DATA.length);
      el.total2.textContent = String(DATA.length);

      el.domain.textContent = item.domain || "";
      el.difficulty.textContent = item.difficulty || "";
      el.source.textContent = item.source || "";

      // 用 textContent 安全插入，再由 MathJax 扫描分隔符渲染
      el.question.textContent = normalizeLatex(item.problem || "");
      el.solution.textContent = normalizeLatex(item.solution || "");
      el.answer.textContent = normalizeLatex(item.answer || "");

      // 只 typeset 更新过的容器，性能更好
      if (window.MathJax && MathJax.typesetPromise) {
        await MathJax.typesetPromise([el.question, el.solution, el.answer]);
      }

      el.prev.disabled = i <= 0;
      el.next.disabled = i >= DATA.length - 1;
    }

    // ============ 文件读取 & JSONL 解析 ============
    el.file.addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;

      el.err.style.display = "none";
      el.hint.style.display = "none";
      DATA = [];
      idx = 0;

      try {
        const text = await file.text();
        const lines = text.split(/\r?\n/);
        const errors = [];
        let loaded = 0;

        for (let ln = 0; ln < lines.length; ln++) {
          const raw = lines[ln].trim();
          if (!raw || raw.startsWith("//") || raw.startsWith("#")) continue; // 空行或注释行跳过
          try {
            // 标准 JSONL：每行一个完整 JSON 对象
            const obj = JSON.parse(raw);
            DATA.push(normalizeItem(obj));
            loaded++;
          } catch (err) {
            // 解析失败记录下来，但不中断全部读取
            errors.push(`第 ${ln + 1} 行解析失败：${err.message}`);
          }
        }

        if (!loaded) {
          el.err.textContent = "未解析到任何题目。请确认文件为 JSONL 格式（每行一个合法 JSON 对象）。";
          el.err.style.display = "block";
        } else {
          el.hint.innerHTML = `已加载 <b>${loaded}</b> 条。` + (errors.length ? `（有 ${errors.length} 行解析失败，见控制台）` : "");
          el.hint.style.display = "block";
          if (errors.length) console.warn("JSONL 解析警告：\n" + errors.join("\n"));
        }

        await render(0);
      } catch (e) {
        el.err.textContent = "读取文件失败：" + e.message;
        el.err.style.display = "block";
        await render(0);
      }
    });

    // ============ 翻页 ============
    el.prev.addEventListener('click', () => { if (idx > 0) { idx--; render(idx); } });
    el.next.addEventListener('click', () => { if (idx < DATA.length - 1) { idx++; render(idx); } });

    // 首屏为空
    render(0);
  </script>
</body>
</html>
